<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moyasar Payment — Secure Saudi Checkout</title>
  <meta name="description" content="Secure Saudi payment powered by Moyasar. Pay with Credit Card or STC Pay." />

  <!-- Moyasar SDK -->
  <link rel="stylesheet" href="https://cdn.moyasar.com/mpf/1.14.0/moyasar.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ─── TOKENS ─────────────────────────────────────────────────────── */
    :root {
      --bg:         #040810;
      --panel:      rgba(10,18,42,0.92);
      --card-bg:    rgba(255,255,255,0.04);
      --border:     rgba(255,255,255,0.09);
      --border-act: rgba(99,179,237,0.55);
      --gold-1:     #f6c866;
      --gold-2:     #e8a838;
      --green:      #22c55e;
      --coral:      #ff6b6b;
      --blue:       #3b82f6;
      --txt:        #f0f4ff;
      --txt2:       #94a3b8;
      --txt3:       #475569;
      --r-panel:    22px;
      --r-input:    12px;
      --r-btn:      14px;
      --ease:       all .25s cubic-bezier(.4,0,.2,1);
      --heading:    'Outfit', sans-serif;
      --body:       'Inter', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: var(--body);
      color: var(--txt);
      overflow-x: hidden;
    }

    /* ─── ANIMATED BACKGROUND ────────────────────────────────────────── */
    .bg {
      position: fixed; inset: 0; z-index: 0; overflow: hidden;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(37,99,235,.13) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(99,32,140,.11) 0%, transparent 60%),
        linear-gradient(180deg, #040810 0%, #060c1c 100%);
    }
    .orb { position:absolute; border-radius:50%; filter:blur(80px); opacity:.5; animation:floatOrb 8s ease-in-out infinite alternate; }
    .orb-1 { width:500px;height:500px;top:-10%;left:-10%; background:radial-gradient(circle,rgba(59,130,246,.25),transparent); }
    .orb-2 { width:400px;height:400px;bottom:-5%;right:-5%; background:radial-gradient(circle,rgba(139,92,246,.2),transparent); animation-delay:-3s; }
    .orb-3 { width:300px;height:300px;top:40%;left:50%; background:radial-gradient(circle,rgba(246,200,102,.08),transparent); animation-delay:-5s; }
    .bg::after {
      content:''; position:absolute; inset:0;
      background-image: linear-gradient(rgba(255,255,255,.014) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);
      background-size:60px 60px;
    }
    @keyframes floatOrb { from{transform:scale(1) translate(0,0)} to{transform:scale(1.2) translate(20px,-20px)} }

    /* ─── LAYOUT ─────────────────────────────────────────────────────── */
    .wrap {
      position:relative; z-index:1;
      min-height:100vh; display:flex; flex-direction:column;
      align-items:center; justify-content:center; padding:24px 16px;
    }

    /* ─── BADGE ──────────────────────────────────────────────────────── */
    .badge {
      display:inline-flex; align-items:center; gap:10px;
      background:rgba(255,255,255,.05); border:1px solid var(--border);
      border-radius:50px; padding:8px 20px; margin-bottom:28px;
      font-family:var(--heading); font-size:12px; font-weight:500;
      color:var(--txt2); letter-spacing:.08em; text-transform:uppercase;
      backdrop-filter:blur(10px); animation:slideDown .6s ease both;
    }
    .dot { width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2s ease infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ─── MAIN CARD ──────────────────────────────────────────────────── */
    .card {
      width:100%; max-width:480px;
      background:var(--panel); border:1px solid var(--border);
      border-radius:var(--r-panel);
      box-shadow:0 32px 80px rgba(0,0,0,.6),0 8px 24px rgba(0,0,0,.4),0 0 60px rgba(99,179,237,.07);
      backdrop-filter:blur(30px); overflow:hidden;
      animation:slideUp .7s ease .1s both;
    }
    .card::before { content:''; display:block; height:2px; background:linear-gradient(90deg,transparent,var(--gold-2) 30%,var(--gold-1) 70%,transparent); }
    .card-body { padding:32px; }

    /* ─── ORDER HEADER ───────────────────────────────────────────────── */
    .order-head { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:22px; }
    .order-title { font-family:var(--heading); font-size:21px; font-weight:700; }
    .order-title span { display:block; font-size:13px; font-weight:400; color:var(--txt2); margin-top:3px; }
    .sar-badge { background:linear-gradient(135deg,var(--gold-2),var(--gold-1)); color:#1a0800; font-family:var(--heading); font-weight:800; font-size:12px; padding:6px 12px; border-radius:8px; letter-spacing:.05em; }

    /* ─── PRODUCT ────────────────────────────────────────────────────── */
    .product { display:flex; align-items:center; gap:14px; background:var(--card-bg); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:20px; }
    .product-icon { width:42px;height:42px;border-radius:10px;flex-shrink:0; background:linear-gradient(135deg,rgba(59,130,246,.3),rgba(139,92,246,.3)); display:flex;align-items:center;justify-content:center;font-size:20px; }
    .product-name { font-family:var(--heading); font-weight:600; font-size:14px; }
    .product-desc { font-size:12px; color:var(--txt2); margin-top:2px; }
    .product-price { margin-left:auto; font-family:var(--heading); font-weight:700; font-size:17px; background:linear-gradient(135deg,var(--gold-2),var(--gold-1)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }

    /* ─── DIVIDER ────────────────────────────────────────────────────── */
    .divider { height:1px; background:linear-gradient(90deg,transparent,var(--border),transparent); margin:20px 0; }

    /* ─── SECTION LABEL ──────────────────────────────────────────────── */
    .lbl { font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--txt3); margin-bottom:12px; }

    /* ─── PAYER FIELDS ───────────────────────────────────────────────── */
    .row { display:flex; gap:10px; margin-bottom:0; }
    .fg  { flex:1; display:flex; flex-direction:column; gap:5px; }
    .fg label { font-size:12px; font-weight:500; color:var(--txt2); }
    .fg input {
      background:rgba(255,255,255,.05); border:1px solid var(--border);
      border-radius:var(--r-input); color:var(--txt);
      font-family:var(--body); font-size:14px;
      padding:11px 13px; outline:none; transition:var(--ease); width:100%;
    }
    .fg input::placeholder { color:var(--txt3); }
    .fg input:focus { border-color:var(--border-act); background:rgba(99,179,237,.05); box-shadow:0 0 0 3px rgba(99,179,237,.08); }

    /* ─── MOYASAR FORM OVERRIDES (dark theme) ────────────────────────── */
    #moyasar-form-container { margin-top: 4px; }

    /* Wrapper and inputs */
    #moyasar-form-container .mysr-form { background: transparent !important; }
    #moyasar-form-container .mysr-field-wrap,
    #moyasar-form-container .mysr-form-group { background: transparent !important; }

    #moyasar-form-container input,
    #moyasar-form-container select {
      background: rgba(255,255,255,.05) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--r-input) !important;
      color: var(--txt) !important;
      font-family: var(--body) !important;
      font-size: 14px !important;
    }
    #moyasar-form-container input:focus,
    #moyasar-form-container select:focus {
      border-color: var(--border-act) !important;
      box-shadow: 0 0 0 3px rgba(99,179,237,.08) !important;
      outline: none !important;
    }
    #moyasar-form-container input::placeholder { color: var(--txt3) !important; }

    /* Labels */
    #moyasar-form-container label,
    #moyasar-form-container .mysr-form-label {
      color: var(--txt2) !important;
      font-family: var(--body) !important;
      font-size: 12px !important;
      font-weight: 500 !important;
    }

    /* Method selector tabs */
    #moyasar-form-container .mysr-payment-methods { border: none !important; background: transparent !important; }
    #moyasar-form-container .mysr-payment-method-btn {
      background: var(--card-bg) !important;
      border: 1px solid var(--border) !important;
      border-radius: 10px !important;
      color: var(--txt2) !important;
      font-family: var(--body) !important;
      transition: var(--ease) !important;
    }
    #moyasar-form-container .mysr-payment-method-btn.active,
    #moyasar-form-container .mysr-payment-method-btn:hover {
      border-color: var(--border-act) !important;
      background: rgba(99,179,237,.08) !important;
      color: var(--txt) !important;
    }

    /* Pay button */
    #moyasar-form-container .mysr-btn,
    #moyasar-form-container button[type="submit"] {
      background: linear-gradient(135deg, var(--gold-2), var(--gold-1)) !important;
      color: #1a0800 !important;
      font-family: var(--heading) !important;
      font-weight: 800 !important;
      font-size: 16px !important;
      border-radius: var(--r-btn) !important;
      border: none !important;
      padding: 15px !important;
      cursor: pointer !important;
      transition: var(--ease) !important;
      letter-spacing: .02em !important;
      width: 100% !important;
      margin-top: 8px !important;
    }
    #moyasar-form-container .mysr-btn:hover,
    #moyasar-form-container button[type="submit"]:hover {
      transform: translateY(-2px) !important;
      box-shadow: 0 8px 30px rgba(232,168,56,.45) !important;
    }

    /* Error messages */
    #moyasar-form-container .mysr-error,
    #moyasar-form-container .mysr-field-error {
      color: var(--coral) !important;
      font-size: 11px !important;
    }

    /* ─── METHODS STRIP ──────────────────────────────────────────────── */
    .methods-strip {
      display:flex; align-items:center; justify-content:center; gap:10px;
      margin-top:18px;
    }
    .method-pill {
      display:flex; align-items:center; gap:6px;
      background:var(--card-bg); border:1px solid var(--border);
      border-radius:8px; padding:7px 12px;
      font-size:11px; color:var(--txt2); font-weight:500;
    }

    /* ─── SECURITY BAR ───────────────────────────────────────────────── */
    .sec-bar {
      display:flex; align-items:center; justify-content:center; gap:7px;
      margin-top:18px; padding-top:16px;
      border-top:1px solid var(--border);
      font-size:11px; color:var(--txt3);
    }
    .sec-bar svg { color:var(--green); flex-shrink:0; }

    /* ─── STATUS OVERLAY ─────────────────────────────────────────────── */
    #overlay {
      display:none; position:fixed; inset:0; z-index:100;
      background:rgba(4,8,16,.92); backdrop-filter:blur(20px);
      align-items:center; justify-content:center;
    }
    #overlay.show { display:flex; }
    .s-box {
      background:var(--panel); border:1px solid var(--border); border-radius:24px;
      padding:44px 36px; text-align:center; max-width:380px; width:90%;
      animation:popIn .4s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes popIn { from{transform:scale(.7);opacity:0} to{transform:scale(1);opacity:1} }
    .s-icon { font-size:52px; margin-bottom:18px; }
    .s-title { font-family:var(--heading); font-size:24px; font-weight:800; margin-bottom:10px; }
    .s-title.ok  { color:var(--green); }
    .s-title.err { color:var(--coral); }
    .s-desc { font-size:14px; color:var(--txt2); line-height:1.6; margin-bottom:24px; }
    .s-id { font-family:monospace; font-size:11px; color:var(--txt3); background:rgba(255,255,255,.04); border:1px solid var(--border); border-radius:8px; padding:8px 12px; margin-bottom:22px; word-break:break-all; }
    .s-back { display:block; width:100%; background:rgba(255,255,255,.08); border:1px solid var(--border); border-radius:var(--r-btn); color:var(--txt); font-family:var(--heading); font-weight:600; font-size:15px; padding:13px; cursor:pointer; text-decoration:none; transition:var(--ease); }
    .s-back:hover { background:rgba(255,255,255,.13); transform:translateY(-1px); }
    .loader { width:44px; height:44px; border-radius:50%; border:3px solid rgba(255,255,255,.1); border-top-color:var(--gold-1); animation:spin .8s linear infinite; margin:0 auto 18px; }
    @keyframes spin { to{transform:rotate(360deg)} }

    /* ─── HISTORY ────────────────────────────────────────────────────── */
    .hist-wrap { width:100%; max-width:480px; margin-top:16px; animation:slideUp .8s ease .3s both; }
    .hist-btn { width:100%; background:rgba(255,255,255,.03); border:1px solid var(--border); border-radius:12px; color:var(--txt2); font-family:var(--body); font-size:13px; padding:11px 16px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; transition:var(--ease); }
    .hist-btn:hover { background:rgba(255,255,255,.06); color:var(--txt); }
    .hist-list { display:none; margin-top:10px; max-height:260px; overflow-y:auto; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:6px; }
    .hist-list.open { display:block; }
    .hist-item { display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:9px; transition:var(--ease); }
    .hist-item:hover { background:rgba(255,255,255,.04); }
    .hist-item + .hist-item { border-top:1px solid var(--border); }
    .hi-left { flex:1; min-width:0; }
    .hi-desc { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .hi-date { font-size:11px; color:var(--txt3); margin-top:2px; }
    .hi-amt  { font-family:var(--heading); font-weight:700; font-size:13px; color:var(--gold-1); margin:0 10px; }
    .pill { display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; padding:3px 7px; border-radius:5px; }
    .pill-paid       { background:rgba(34,197,94,.15);   color:var(--green); }
    .pill-failed     { background:rgba(255,107,107,.15); color:var(--coral); }
    .pill-initiated  { background:rgba(59,130,246,.15);  color:var(--blue); }
    .pill-authorized { background:rgba(246,200,102,.15); color:var(--gold-1); }

    /* ─── ANIMATIONS ─────────────────────────────────────────────────── */
    @keyframes slideUp   { from{transform:translateY(24px);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes slideDown { from{transform:translateY(-12px);opacity:0} to{transform:translateY(0);opacity:1} }

    @media (max-width:500px) { .card-body{padding:22px;} .row{flex-direction:column;} }
  </style>
</head>
<body>

<!-- Background -->
<div class="bg" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<!-- Status Overlay -->
<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="s-title">
  <div class="s-box" id="s-box"></div>
</div>

<!-- Main -->
<div class="wrap" id="main">

  <div class="badge">
    <div class="dot" aria-hidden="true"></div>
    Secure Checkout · Saudi Arabia · Test Mode
  </div>

  <section class="card" aria-label="Payment checkout">
    <div class="card-body">

      <!-- Header -->
      <div class="order-head">
        <div class="order-title">
          Complete Order
          <span>Review and pay securely below</span>

      </div>

      <!-- Product -->
      <div class="product">
        <div class="product-icon" aria-hidden="true">🎁</div>
        <div>
          <div class="product-name">Premium Package</div>

        </div>

      <div class="divider"></div>

          <label for="f-name">Full Name</label>

      <!-- Accepted methods -->

        <div class="method-pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          Credit Card
        </div>
        <div class="method-pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          STC Pay
        </div>
        <div class="method-pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>

  <!-- History -->
  <div class="hist-wrap">

      </svg>
    </button>

</div>

<!-- Moyasar SDK -->
<script src="https://cdn.moyasar.com/mpf/1.14.0/moyasar.js"></script>
<script>
/* ════════════════════════════════════════════════════════════════════
   CONFIG — publishable key (safe to expose in frontend)
════════════════════════════════════════════════════════════════════ */
const GRAPHQL_URL    = '/graphql';
const AMOUNT_HALALAS = 10000;   // 100.00 SAR (1 SAR = 100 Halalas)
const PRODUCT_DESC   = 'Premium Package — Annual Access';
const MOYASAR_PK     = 'pk_test_RVnhNipcchuneCmBNKfUTM74rMroJfCsvR9U5hWb';

/* ════════════════════════════════════════════════════════════════════
   GRAPHQL HELPER
════════════════════════════════════════════════════════════════════ */
async function gql(query, variables = {}) {
  const res = await fetch(GRAPHQL_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apollo-require-preflight': 'true',
    },
    body: JSON.stringify({ query, variables }),
  });
  const json = await res.json();
  if (json.errors?.length) throw new Error(json.errors[0].message);
  return json.data;
}

/* Create an INITIATED payment record in PostgreSQL */
async function initiatePayment(payerName, payerEmail) {
  const data = await gql(`
    mutation Initiate($input: CreatePaymentInput!) {
      initiatePayment(input: $input) { id amount currency status }
    }
  `, {
    input: {
      amount: AMOUNT_HALALAS,
      description: PRODUCT_DESC,
      payerName,
      payerEmail,
    },
  });
  return data.initiatePayment;
}

async function fetchPayments() {
  const data = await gql(`
    query { payments { id amount currency status description paymentMethod createdAt } }
  `);
  return data.payments;
}

/* ════════════════════════════════════════════════════════════════════
   STATUS OVERLAY
════════════════════════════════════════════════════════════════════ */
function showLoading(msg = 'Processing payment…') {
  document.getElementById('s-box').innerHTML = `
    <div class="loader" role="progressbar" aria-label="Loading"></div>
    <div class="s-title" style="color:var(--txt2);font-size:18px">${msg}</div>
    <p class="s-desc" style="margin-top:8px">Please wait, do not close this window.</p>
  `;
  document.getElementById('overlay').classList.add('show');
}

function showStatus(type, payment) {
  const isPaid = type === 'paid';
  const sar    = payment?.amount ? (payment.amount / 100).toFixed(2) : '100.00';
  document.getElementById('s-box').innerHTML = `
    <div class="s-icon">${isPaid ? '✅' : '❌'}</div>
    <div class="s-title ${isPaid ? 'ok' : 'err'}" id="s-title">
      ${isPaid ? 'Payment Successful!' : 'Payment Failed'}
    </div>
    <p class="s-desc">
      ${isPaid
        ? `Your payment of <strong>${sar} SAR</strong> was processed successfully. A receipt has been sent to your email.`
        : 'Your payment could not be completed. Please check your card details and try again.'}
    </p>
    ${payment?.id ? `<div class="s-id">Payment ID: ${payment.id}</div>` : ''}
    <button class="s-back" onclick="window.location.href='/'">
      ${isPaid ? '🎉 Done — Return Home' : '↩ Try Again'}
    </button>
  `;
  document.getElementById('overlay').classList.add('show');
  loadHistory();
}

/* ════════════════════════════════════════════════════════════════════
   HISTORY
════════════════════════════════════════════════════════════════════ */
async function loadHistory() {
  try {
    const list  = document.getElementById('hist-list');
    const items = await fetchPayments();
    if (!items.length) {
      list.innerHTML = '<p style="padding:14px;font-size:13px;color:var(--txt3);text-align:center">No payments yet.</p>';
      return;
    }
    list.innerHTML = items.map(p => {
      const sar  = (p.amount / 100).toFixed(2);
      const date = new Date(p.createdAt).toLocaleString('en-SA', {
        year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit',
      });
      const cls = { PAID:'pill-paid', FAILED:'pill-failed', INITIATED:'pill-initiated', AUTHORIZED:'pill-authorized' }[p.status] ?? 'pill-initiated';
      return `
        <div class="hist-item" role="listitem">
          <div class="hi-left">
            <div class="hi-desc">${p.description}</div>
            <div class="hi-date">${date}</div>
          </div>
          <div class="hi-amt">${sar} SAR</div>
          <span class="pill ${cls}">${p.status}</span>
        </div>`;
    }).join('');
  } catch(e) { console.warn('History error:', e.message); }
}

document.getElementById('hist-btn').addEventListener('click', function() {
  const list   = document.getElementById('hist-list');
  const isOpen = list.classList.toggle('open');
  this.setAttribute('aria-expanded', String(isOpen));
  if (isOpen) loadHistory();
});

/* ════════════════════════════════════════════════════════════════════
   HANDLE CALLBACK REDIRECT
   Moyasar redirects to /payments/callback → NestJS verifies with sk_test_
   → redirects to /?status=paid&payment_id=...
════════════════════════════════════════════════════════════════════ */
(function handleCallback() {
  const params = new URLSearchParams(window.location.search);
  const status = params.get('status');
  const payId  = params.get('payment_id');
  if (!status) return;
  window.history.replaceState({}, '', '/');
  showStatus(status === 'paid' ? 'paid' : 'failed', { id: payId, amount: AMOUNT_HALALAS });
})();

/* ════════════════════════════════════════════════════════════════════
   MOYASAR INIT — mounts the real card form using pk_test_ key
════════════════════════════════════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', () => {
  if (!window.Moyasar) {
    document.getElementById('moyasar-form-container').innerHTML =
      '<p style="color:var(--coral);font-size:13px;padding:12px 0">⚠️ Could not load Moyasar SDK. Check your internet connection.</p>';
    return;
  }

  Moyasar.init({
    element: '#moyasar-payment-form',

    amount:              AMOUNT_HALALAS,
    currency:            'SAR',
    description:         PRODUCT_DESC,
    publishable_api_key: MOYASAR_PK,

    // NestJS callback endpoint — localPaymentId is injected in on_initiating
    callback_url: window.location.origin + '/payments/callback',

    methods: ['creditcard', 'stcpay'],

    /* Called BEFORE Moyasar submits the card data.
       We create the local DB record here and inject its ID into the callback URL. */
    on_initiating: async function() {
      const name  = document.getElementById('f-name').value.trim();
      const email = document.getElementById('f-email').value.trim();

      if (!name) { alert('Please enter your full name.'); return false; }
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        alert('Please enter a valid email address.'); return false;
      }

      try {
        // Create INITIATED record in PostgreSQL via GraphQL mutation
        const payment = await initiatePayment(name, email);

        // Inject local UUID into Moyasar's callback URL so the
        // NestJS controller knows which DB record to update
        this.callback_url =
          `${window.location.origin}/payments/callback?payment_id=${payment.id}`;

        return true; // allow Moyasar to proceed with card submission
      } catch (err) {
        console.error('initiatePayment failed:', err);
        alert('Could not start payment session. Please try again.');
        return false;
      }
    },

    /* Called right before Moyasar redirects to callback_url */
    on_completed: function () {
      showLoading('Verifying payment with Moyasar…');
    },

    /* Called if Moyasar reports an immediate failure */
    on_failed: function (payment) {
      showStatus('failed', { amount: AMOUNT_HALALAS });
    },
  });
});
</script>
</body>
