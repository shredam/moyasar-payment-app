<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moyasar Payment — Secure Saudi Checkout</title>
  <meta name="description" content="Secure, fast Saudi payment powered by Moyasar. Pay with Credit Card, Mada, or Apple Pay." />

  <!-- Moyasar Payment Form CSS -->
  <link rel="stylesheet" href="https://cdn.moyasar.com/mpf/1.14.0/moyasar.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ─── DESIGN TOKENS ───────────────────────────────────────────── */
    :root {
      --bg-deep:       #040810;
      --bg-mid:        #070d1a;
      --bg-panel:      rgba(12, 22, 48, 0.85);
      --bg-card:       rgba(255,255,255,0.04);
      --border:        rgba(255,255,255,0.08);
      --border-active: rgba(99,179,237,0.5);

      --gold-1: #f6c866;
      --gold-2: #e8a838;
      --coral:  #ff6b6b;
      --green:  #22c55e;
      --blue:   #3b82f6;

      --text-primary:   #f0f4ff;
      --text-secondary: #94a3b8;
      --text-muted:     #475569;

      --shadow-card: 0 32px 80px rgba(0,0,0,0.6), 0 8px 24px rgba(0,0,0,0.4);
      --shadow-glow: 0 0 60px rgba(99,179,237,0.08);

      --radius-panel: 24px;
      --radius-input: 12px;
      --radius-btn:   14px;

      --font-heading: 'Outfit', sans-serif;
      --font-body:    'Inter', sans-serif;

      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ─── RESET & BASE ────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      background: var(--bg-deep);
      font-family: var(--font-body);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    /* ─── ANIMATED BACKGROUND ─────────────────────────────────────── */
    .bg-canvas {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(37,99,235,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(99,32,140,0.10) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(6,22,52,0.9) 0%, transparent 100%),
        linear-gradient(180deg, #040810 0%, #060c1c 100%);
      overflow: hidden;
    }

    .bg-orb {
      position: absolute; border-radius: 50%;
      filter: blur(80px); opacity: 0.5;
      animation: floatOrb 8s ease-in-out infinite alternate;
    }
    .bg-orb-1 { width: 500px; height: 500px; top: -10%; left: -10%;
      background: radial-gradient(circle, rgba(59,130,246,0.25), transparent);
      animation-delay: 0s; }
    .bg-orb-2 { width: 400px; height: 400px; bottom: -5%; right: -5%;
      background: radial-gradient(circle, rgba(139,92,246,0.20), transparent);
      animation-delay: -3s; }
    .bg-orb-3 { width: 300px; height: 300px; top: 40%; left: 50%;
      background: radial-gradient(circle, rgba(246,200,102,0.08), transparent);
      animation-delay: -5s; }

    @keyframes floatOrb {
      from { transform: scale(1) translate(0,0); }
      to   { transform: scale(1.2) translate(20px, -20px); }
    }

    /* Grid lines overlay */
    .bg-canvas::after {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* ─── LAYOUT ─────────────────────────────────────────────────── */
    .app-wrapper {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px 16px;
    }

    /* ─── HEADER BADGE ───────────────────────────────────────────── */
    .brand-badge {
      display: inline-flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 50px; padding: 8px 20px;
      margin-bottom: 32px;
      font-family: var(--font-heading);
      font-size: 13px; font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: 0.05em; text-transform: uppercase;
      backdrop-filter: blur(10px);
      animation: fadeSlideDown 0.6s ease both;
    }
    .brand-badge .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
      animation: pulse 2s ease infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* ─── MAIN CHECKOUT CARD ─────────────────────────────────────── */
    .checkout-card {
      width: 100%; max-width: 480px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-panel);
      box-shadow: var(--shadow-card), var(--shadow-glow);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      overflow: hidden;
      animation: fadeSlideUp 0.7s ease 0.1s both;
    }

    /* Gold top accent line */
    .checkout-card::before {
      content: '';
      display: block; height: 2px; width: 100%;
      background: linear-gradient(90deg, transparent 0%, var(--gold-2) 30%, var(--gold-1) 70%, transparent 100%);
    }

    .card-body { padding: 36px; }

    /* ─── ORDER SUMMARY ──────────────────────────────────────────── */
    .order-header {
      display: flex; align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .order-title {
      font-family: var(--font-heading);
      font-size: 22px; font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }
    .order-title span {
      display: block; font-size: 13px; font-weight: 400;
      color: var(--text-secondary); margin-top: 4px;
    }
    .currency-badge {
      background: linear-gradient(135deg, var(--gold-2), var(--gold-1));
      color: #1a0a00; font-family: var(--font-heading);
      font-weight: 800; font-size: 13px;
      padding: 6px 12px; border-radius: 8px;
      letter-spacing: 0.05em;
    }

    .order-item {
      display: flex; align-items: center; gap: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px; padding: 16px;
      margin-bottom: 20px;
    }
    .order-item-icon {
      width: 44px; height: 44px; border-radius: 10px;
      background: linear-gradient(135deg, rgba(59,130,246,0.3), rgba(139,92,246,0.3));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    .order-item-info { flex: 1; }
    .order-item-name {
      font-family: var(--font-heading); font-weight: 600;
      font-size: 15px; color: var(--text-primary);
    }
    .order-item-desc {
      font-size: 12px; color: var(--text-secondary); margin-top: 2px;
    }
    .order-item-price {
      font-family: var(--font-heading); font-weight: 700;
      font-size: 18px;
      background: linear-gradient(135deg, var(--gold-2), var(--gold-1));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ─── DIVIDER ─────────────────────────────────────────────────── */
    .divider {
      height: 1px; width: 100%;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 24px 0;
    }

    /* ─── PAYER DETAILS ──────────────────────────────────────────── */
    .section-label {
      font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--text-muted);
      margin-bottom: 14px;
    }
    .field-row { display: flex; gap: 12px; margin-bottom: 12px; }
    .field-group { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .field-group label {
      font-size: 12px; font-weight: 500; color: var(--text-secondary);
    }
    .field-group input {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      color: var(--text-primary);
      font-family: var(--font-body); font-size: 14px;
      padding: 12px 14px; outline: none;
      transition: var(--transition);
    }
    .field-group input::placeholder { color: var(--text-muted); }
    .field-group input:focus {
      border-color: var(--border-active);
      background: rgba(99,179,237,0.05);
      box-shadow: 0 0 0 3px rgba(99,179,237,0.08);
    }

    /* ─── MOYASAR FORM AREA ──────────────────────────────────────── */
    .payment-form-section {
      margin-top: 8px;
    }

    /* Override Moyasar form styles to match our dark theme */
    #moyasar-payment-form .mysr-form,
    #moyasar-payment-form .mysr-field-wrap {
      background: rgba(255,255,255,0.04) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius-input) !important;
      color: var(--text-primary) !important;
    }
    #moyasar-payment-form .mysr-form-label {
      color: var(--text-secondary) !important;
      font-family: var(--font-body) !important;
      font-size: 12px !important;
    }
    #moyasar-payment-form input,
    #moyasar-payment-form select {
      background: transparent !important;
      color: var(--text-primary) !important;
      font-family: var(--font-body) !important;
    }
    #moyasar-payment-form .mysr-btn,
    #moyasar-payment-form button[type="submit"] {
      background: linear-gradient(135deg, #e8a838, #f6c866) !important;
      color: #1a0800 !important;
      font-family: var(--font-heading) !important;
      font-weight: 700 !important;
      font-size: 16px !important;
      border-radius: var(--radius-btn) !important;
      border: none !important;
      padding: 16px !important;
      cursor: pointer !important;
      transition: var(--transition) !important;
      letter-spacing: 0.02em !important;
    }
    #moyasar-payment-form button[type="submit"]:hover {
      transform: translateY(-2px) !important;
      box-shadow: 0 8px 30px rgba(232,168,56,0.4) !important;
    }

    /* ─── PAYMENT METHODS DISPLAY ────────────────────────────────── */
    .methods-row {
      display: flex; align-items: center;
      justify-content: center; gap: 12px;
      margin-top: 20px;
    }
    .method-pill {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 12px;
      font-size: 11px; color: var(--text-secondary);
      font-weight: 500;
    }
    .method-pill svg { flex-shrink: 0; }

    /* ─── SECURITY FOOTER ────────────────────────────────────────── */
    .security-bar {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 24px; padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 11px; color: var(--text-muted);
    }
    .security-bar svg { color: var(--green); }

    /* ─── STATUS OVERLAY ─────────────────────────────────────────── */
    #status-overlay {
      display: none; position: fixed; inset: 0;
      z-index: 100; background: rgba(4,8,16,0.9);
      backdrop-filter: blur(20px);
      align-items: center; justify-content: center;
    }
    #status-overlay.show { display: flex; }

    .status-box {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 24px; padding: 48px 40px;
      text-align: center; max-width: 400px; width: 90%;
      animation: scaleIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes scaleIn {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .status-icon {
      font-size: 56px; margin-bottom: 20px;
      animation: bounceIn 0.6s ease 0.2s both;
    }
    @keyframes bounceIn {
      from { transform: scale(0); } 60% { transform: scale(1.2); }
      to   { transform: scale(1); }
    }

    .status-title {
      font-family: var(--font-heading); font-size: 26px;
      font-weight: 800; margin-bottom: 10px;
    }
    .status-title.success { color: var(--green); }
    .status-title.failed  { color: var(--coral); }

    .status-desc {
      font-size: 14px; color: var(--text-secondary);
      line-height: 1.6; margin-bottom: 28px;
    }
    .status-id {
      font-family: monospace; font-size: 11px;
      color: var(--text-muted); background: rgba(255,255,255,0.04);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 14px; margin-bottom: 24px;
      word-break: break-all;
    }

    .btn-back {
      display: inline-block; width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border); border-radius: var(--radius-btn);
      color: var(--text-primary); font-family: var(--font-heading);
      font-weight: 600; font-size: 15px; padding: 14px;
      cursor: pointer; text-decoration: none;
      transition: var(--transition);
    }
    .btn-back:hover {
      background: rgba(255,255,255,0.12);
      transform: translateY(-1px);
    }

    /* ─── LOADING SPINNER ────────────────────────────────────────── */
    .loader-ring {
      width: 48px; height: 48px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--gold-1);
      animation: spin 0.9s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── HISTORY PANEL ──────────────────────────────────────────── */
    .history-panel {
      width: 100%; max-width: 480px;
      margin-top: 20px;
      animation: fadeSlideUp 0.8s ease 0.3s both;
    }
    .history-toggle {
      width: 100%; background: rgba(255,255,255,0.03);
      border: 1px solid var(--border); border-radius: 12px;
      color: var(--text-secondary); font-family: var(--font-body);
      font-size: 13px; padding: 12px 18px;
      cursor: pointer; text-align: left;
      display: flex; align-items: center; justify-content: space-between;
      transition: var(--transition);
    }
    .history-toggle:hover { background: rgba(255,255,255,0.06); color: var(--text-primary); }
    .history-list {
      display: none; margin-top: 12px;
      max-height: 280px; overflow-y: auto;
      background: var(--bg-panel);
      border: 1px solid var(--border); border-radius: 14px;
      padding: 8px;
    }
    .history-list.open { display: block; }
    .history-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-radius: 10px;
      transition: var(--transition); cursor: default;
    }
    .history-item:hover { background: rgba(255,255,255,0.04); }
    .history-item + .history-item { border-top: 1px solid var(--border); }
    .history-item-left { flex: 1; min-width: 0; }
    .history-item-desc { font-size: 13px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-item-date { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .history-item-amount { font-family: var(--font-heading); font-weight: 700; font-size: 14px; color: var(--gold-1); margin: 0 12px; }
    .badge {
      display: inline-block; font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      padding: 3px 8px; border-radius: 6px;
    }
    .badge-paid       { background: rgba(34,197,94,0.15);  color: var(--green); }
    .badge-failed     { background: rgba(255,107,107,0.15); color: var(--coral); }
    .badge-initiated  { background: rgba(59,130,246,0.15);  color: var(--blue); }
    .badge-authorized { background: rgba(246,200,102,0.15); color: var(--gold-1); }

    /* ─── ANIMATIONS ─────────────────────────────────────────────── */
    @keyframes fadeSlideUp {
      from { transform: translateY(24px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    @keyframes fadeSlideDown {
      from { transform: translateY(-12px); opacity: 0; }
      to   { transform: translateY(0);     opacity: 1; }
    }

    /* ─── RESPONSIVE ─────────────────────────────────────────────── */
    @media (max-width: 520px) {
      .card-body { padding: 24px; }
      .field-row { flex-direction: column; }
      .order-title { font-size: 19px; }
    }
  </style>
</head>
<body>

<!-- Animated Background -->
<div class="bg-canvas" aria-hidden="true">
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>
</div>

<!-- Status Overlay (shown after callback) -->
<div id="status-overlay" role="dialog" aria-modal="true" aria-labelledby="status-title-text">
  <div class="status-box" id="status-box"></div>
</div>

<!-- Main App -->
<main class="app-wrapper" id="main-content">

  <!-- Brand Badge -->
  <div class="brand-badge" role="banner">
    <div class="dot" aria-hidden="true"></div>
    Secure Checkout · Saudi Arabia
  </div>

  <!-- Checkout Card -->
  <section class="checkout-card" aria-label="Payment checkout">
    <div class="card-body">

      <!-- Header -->
      <div class="order-header">
        <div class="order-title">
          Complete Order
          <span>Review and pay securely below</span>
        </div>
        <div class="currency-badge" aria-label="Saudi Riyal">SAR</div>
      </div>

      <!-- Product Item -->
      <div class="order-item" id="order-item-display">
        <div class="order-item-icon" aria-hidden="true">🎁</div>
        <div class="order-item-info">
          <div class="order-item-name">Premium Package</div>
          <div class="order-item-desc">Annual access · VAT included</div>
        </div>
        <div class="order-item-price">100.00 SAR</div>
      </div>

      <div class="divider" role="separator"></div>

      <!-- Payer Details -->
      <div class="section-label">Your Details</div>
      <div class="field-row">
        <div class="field-group">
          <label for="payer-name">Full Name</label>
          <input type="text" id="payer-name" name="payerName"
            placeholder="Ahmed Al-Rashidi" autocomplete="name" />
        </div>
        <div class="field-group">
          <label for="payer-email">Email Address</label>
          <input type="email" id="payer-email" name="payerEmail"
            placeholder="ahmed@example.com" autocomplete="email" />
        </div>
      </div>

      <div class="divider" role="separator"></div>

      <!-- Payment Form -->
      <div class="section-label">Payment Details</div>
      <div class="payment-form-section">
        <div id="moyasar-payment-form"></div>
      </div>

      <!-- Accepted Methods -->
      <div class="methods-row" aria-label="Accepted payment methods">
        <div class="method-pill">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          Credit Card
        </div>
        <div class="method-pill">
          <svg width="16" height="16" viewBox="0 0 32 20" fill="currentColor"><text x="2" y="15" font-size="11" font-weight="bold" fill="#4CAF50">مدى</text></svg>
          Mada
        </div>
        <div class="method-pill">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
          Apple Pay
        </div>
      </div>

      <!-- Security Notice -->
      <div class="security-bar" role="contentinfo">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        256-bit SSL · Powered by Moyasar · PCI DSS Compliant
      </div>

    </div><!-- .card-body -->
  </section><!-- .checkout-card -->

  <!-- Payment History -->
  <section class="history-panel" aria-label="Payment history">
    <button class="history-toggle" id="history-toggle-btn"
      aria-expanded="false" aria-controls="history-list">
      Recent Payments
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5" aria-hidden="true">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </button>
    <div class="history-list" id="history-list" role="list"></div>
  </section>

</main>

<!-- Moyasar Payment Form JS -->
<script src="https://cdn.moyasar.com/mpf/1.14.0/moyasar.js"></script>
<script>
  /* ─── CONFIG ────────────────────────────────────────────────────── */
  const GRAPHQL_URL     = '/graphql';
  const AMOUNT_HALALAS  = 10000;   // 100.00 SAR  (1 SAR = 100 Halalas)
  const PRODUCT_DESC    = 'Premium Package — Annual Access';
  // NOTE: Replace with your real Sandbox publishable key from dashboard.moyasar.com
  const MOYASAR_PK      = window.__ENV_PK__ || 'pk_test_REPLACE_WITH_REAL_KEY';

  /* ─── GRAPHQL HELPERS ────────────────────────────────────────────── */
  async function gql(query, variables = {}) {
    const res = await fetch(GRAPHQL_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, variables }),
    });
    const json = await res.json();
    if (json.errors?.length) throw new Error(json.errors[0].message);
    return json.data;
  }

  async function initiatePayment(payerName, payerEmail) {
    const data = await gql(`
      mutation InitiatePayment($input: CreatePaymentInput!) {
        initiatePayment(input: $input) { id amount currency description status }
      }
    `, {
      input: {
        amount: AMOUNT_HALALAS,
        description: PRODUCT_DESC,
        payerName,
        payerEmail,
      },
    });
    return data.initiatePayment;
  }

  async function verifyPaymentGql(moyasarPaymentId, localPaymentId) {
    const data = await gql(`
      mutation VerifyPayment($moyasarPaymentId: ID!, $localPaymentId: ID!) {
        verifyPayment(moyasarPaymentId: $moyasarPaymentId, localPaymentId: $localPaymentId) {
          id moyasarId amount currency status paymentMethod
        }
      }
    `, { moyasarPaymentId, localPaymentId });
    return data.verifyPayment;
  }

  async function fetchPayments() {
    const data = await gql(`
      query {
        payments {
          id amount currency status description paymentMethod createdAt
        }
      }
    `);
    return data.payments;
  }

  /* ─── STATUS OVERLAY ────────────────────────────────────────────── */
  function showStatus(type, payment) {
    const overlay  = document.getElementById('status-overlay');
    const box      = document.getElementById('status-box');
    const isPaid   = type === 'paid';
    const amountSAR = payment?.amount ? (payment.amount / 100).toFixed(2) : '—';

    box.innerHTML = `
      <div class="status-icon" aria-hidden="true">${isPaid ? '✅' : '❌'}</div>
      <div class="status-title ${isPaid ? 'success' : 'failed'}" id="status-title-text">
        ${isPaid ? 'Payment Successful!' : 'Payment Failed'}
      </div>
      <p class="status-desc">
        ${isPaid
          ? `Your payment of <strong>${amountSAR} SAR</strong> was processed successfully. A confirmation has been sent to your email.`
          : 'Your payment could not be processed. Please check your details and try again.'}
      </p>
      ${payment?.id ? `<div class="status-id">Payment ID: ${payment.id}</div>` : ''}
      <a href="/" class="btn-back" id="back-btn" role="button">
        ${isPaid ? '🎉 Done — Return Home' : '↩ Try Again'}
      </a>
    `;

    overlay.classList.add('show');
    loadHistory();
  }

  function showLoading(message = 'Verifying payment…') {
    const overlay = document.getElementById('status-overlay');
    const box     = document.getElementById('status-box');
    box.innerHTML = `
      <div class="loader-ring" role="progressbar" aria-label="Loading"></div>
      <div class="status-title" style="color:var(--text-secondary);font-size:18px">${message}</div>
    `;
    overlay.classList.add('show');
  }

  /* ─── PAYMENT HISTORY ────────────────────────────────────────────── */
  async function loadHistory() {
    try {
      const list  = document.getElementById('history-list');
      const items = await fetchPayments();
      if (!items.length) {
        list.innerHTML = '<p style="padding:16px;font-size:13px;color:var(--text-muted);text-align:center">No payments yet.</p>';
        return;
      }
      list.innerHTML = items.map(p => {
        const sar  = (p.amount / 100).toFixed(2);
        const date = new Date(p.createdAt).toLocaleDateString('en-SA', {
          year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
        });
        const badgeClass = {
          PAID: 'badge-paid', FAILED: 'badge-failed',
          INITIATED: 'badge-initiated', AUTHORIZED: 'badge-authorized',
        }[p.status] ?? 'badge-initiated';

        return `
          <div class="history-item" role="listitem">
            <div class="history-item-left">
              <div class="history-item-desc">${p.description}</div>
              <div class="history-item-date">${date}</div>
            </div>
            <div class="history-item-amount">${sar} SAR</div>
            <span class="badge ${badgeClass}">${p.status}</span>
          </div>
        `;
      }).join('');
    } catch (e) {
      console.warn('Could not load payment history:', e.message);
    }
  }

  /* Toggle history list */
  document.getElementById('history-toggle-btn').addEventListener('click', function () {
    const list    = document.getElementById('history-list');
    const isOpen  = list.classList.toggle('open');
    this.setAttribute('aria-expanded', String(isOpen));
    if (isOpen) loadHistory();
  });

  /* ─── MOYASAR INIT ────────────────────────────────────────────────── */
  let localPaymentId = null;

  async function mountMoyasar() {
    if (!window.Moyasar) { console.error('Moyasar SDK not loaded'); return; }

    Moyasar.init({
      element:       '.mysr-form',
      amount:        AMOUNT_HALALAS,
      currency:      'SAR',
      description:   PRODUCT_DESC,
      publishable_api_key: MOYASAR_PK,
      callback_url:  window.location.origin + '/payments/callback',

      methods: ['creditcard', 'applepay', 'stcpay'],

      apple_pay: {
        country:            'SA',
        label:              'Premium Package',
        validate_merchant_url: 'https://api.moyasar.com/v1/applepay/initiate',
      },

      on_initiating: async function () {
        const name  = document.getElementById('payer-name').value.trim();
        const email = document.getElementById('payer-email').value.trim();

        if (!name || !email) {
          alert('Please enter your name and email before paying.');
          return false; // cancel the payment
        }

        try {
          const payment = await initiatePayment(name, email);
          localPaymentId = payment.id;
          // Inject local payment ID into the callback URL as a query param
          this.callback_url =
            window.location.origin + '/payments/callback?payment_id=' + payment.id;
          return true;
        } catch (err) {
          console.error('Failed to initiate payment:', err);
          alert('Could not start payment session. Please try again.');
          return false;
        }
      },

      on_completed: function (payment) {
        // Moyasar calls this after 3DS/redirect; show loading while verifying
        showLoading('Confirming your payment…');
      },

      on_failed: function (payment) {
        showStatus('failed', payment);
      },
    });
  }

  /* ─── HANDLE CALLBACK REDIRECT ────────────────────────────────────── */
  async function handleCallback() {
    const params   = new URLSearchParams(window.location.search);
    const status   = params.get('status');
    const payId    = params.get('payment_id');

    if (!status) return; // normal page load — no callback

    // Clean URL
    window.history.replaceState({}, '', '/');

    if (status === 'paid') {
      showStatus('paid', { id: payId });
    } else if (status === 'failed' || status === 'error') {
      showStatus('failed', { id: payId });
    }
  }

  /* ─── BOOT ───────────────────────────────────────────────────────── */
  document.addEventListener('DOMContentLoaded', async () => {
    await mountMoyasar();
    await handleCallback();
  });
</script>
