version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: moyasar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-moyasar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-moyasar_secret}
      POSTGRES_DB: ${DB_NAME:-moyasar_payments}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-moyasar}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
